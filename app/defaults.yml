# DO NOT EDIT THIS FILE.
# Create a config.yml outside of the app directory
# See documentation for details.

settings:
  log_mode: text
  log_level: INFO
  enable_charts: false
  output_mode: cli
  update_interval: 300
  start_worker_interval: 60
  market_data_chunk_size: 20
  market_pairs: null
  timezone: UTC
  
  # ─────────────────────────────────────────
  # Dynamic Pairs - Filtrado automático de mercados
  # ─────────────────────────────────────────
  # Si enabled=true y market_pairs=null, usa filtros dinámicos
  # Flujo: DataManager.get_top_pairs() → Lista filtrada
  dynamic_pairs:
    enabled: false              # Activar filtrado dinámico
    source: volume              # volume | manual (futuro: coingecko)
    top_n: 50                   # Cantidad de pares a analizar
    quote_currency: USDT        # Moneda de cotización
    min_volume_24h: 1000000     # Volumen mínimo (en USDT)
    exclude:                    # Pares a excluir
      - USDC/USDT
      - BUSD/USDT
      - TUSD/USDT
      - DAI/USDT

exchanges: null

notifiers:
  # ─────────────────────────────────────────
  # Telegram - Notificador Principal
  # ─────────────────────────────────────────
  telegram:
    required:
      token: null
      chat_id: null
    optional:
      parse_mode: html
      template: |
        {% if status == 'hot' %}🟢 <b>COMPRA</b>{% else %}🔴 <b>VENTA</b>{% endif %}
        
        📊 <b>{{market}}</b>
        ⏱ {{analysis.config.candle_period}}
        📈 {{indicator|upper}}
        🏷 {{values}}
  
  # ─────────────────────────────────────────
  # Webhook - Para integraciones futuras
  # ─────────────────────────────────────────
  webhook:
    required:
      url: null
    optional:
      username: null
      password: null
  
  # ─────────────────────────────────────────
  # Stdout - Debug/Desarrollo
  # ─────────────────────────────────────────
  stdout:
    required:
      enable: null
    optional:
      template: "{{exchange}}-{{market}}-{{indicator}}-{{indicator_number}} is {{status}}!{{ '\n' -}}"


indicators:
  momentum:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - momentum
      hot: 0
      cold: 0
      candle_period: 1d
      period_count: 10
  mfi:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - mfi
      hot: 0
      cold: 0
      candle_period: 1d
      period_count: 10
  obv:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - obv
      hot: 0
      cold: 0
      candle_period: 1d
  rsi:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - rsi
      hot: 30
      cold: 70
      candle_period: 1d
      period_count: 14
  stoch_rsi:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - stoch_rsi
      hot: 20
      cold: 80
      candle_period: 1d
      period_count: 14
  macd:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - macd
      hot: 0
      cold: 0
      candle_period: 1d
  ichimoku:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal:
        - leading_span_a
        - leading_span_b
      hot: true
      cold: true
      candle_period: 1d
  iiv:
    - enabled: true
      alert_enabled: true
      alert_frequency: always
      signal:
        - iiv
      hot: 5
      cold: 0
      candle_period: 5m
informants:
  lrsi:
    - enabled: true
      alert_enabled: true
      signal:
        - lrsi
      candle_period: 4h
    - enabled: true
      alert_enabled: true
      signal:
        - lrsi
      candle_period: 1d  
  vwap:
    - enabled: true
      signal:
        - vwap
      candle_period: 1d
      period_count: 15
  sma:
    - enabled: true
      signal:
        - sma
      candle_period: 1d
      period_count: 15
  ema:
    - enabled: true
      signal:
        - ema
      candle_period: 1d
      period_count: 15
  bollinger_bands:
    - enabled: true
      signal:
        - upperband
        - middleband
        - lowerband
      candle_period: 1d
  ohlcv:
    - enabled: true
      signal:
        - close
      candle_period: 1d
      period_count: 15

crossovers:
  std_crossover:
    - enabled: false
      alert_enabled: true
      alert_frequency: once
      key_indicator: ema
      key_indicator_index: 0
      key_indicator_type: informants
      key_signal: ema
      crossed_indicator: sma
      crossed_indicator_index: 0
      crossed_indicator_type: informants
      crossed_signal: sma
