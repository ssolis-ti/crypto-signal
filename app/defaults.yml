# DO NOT EDIT THIS FILE.
# Create a config.yml outside of the app directory
# See documentation for details.

settings:
  log_mode: text
  log_level: INFO
  enable_charts: false
  output_mode: cli
  update_interval: 300
  start_worker_interval: 60
  market_data_chunk_size: 20
  market_pairs: null
  timezone: UTC

  # ─────────────────────────────────────────
  # Alertas Wyckoff en vivo (specs/023-wyckoff-live-alerts/)
  # ─────────────────────────────────────────
  # Deshabilitado por defecto: opt-in explicito, no todos los clones de este
  # proyecto open-source deberian empezar a recibir un tipo de alerta nuevo sin
  # que el operador lo decida en su propio config.yml.
  wyckoff_alerts:
    enabled: false
    # specs/031-wyckoff-twitter-sentiment/: enriquecimiento OPCIONAL e informativo,
    # no forma parte del edge validado. Requiere GETXAPI_API_KEY y GEMINI_API_KEY en .env.
    twitter_sentiment:
      enabled: false
    # specs/033-rumor-radar/: vela de 4h con volumen >= 2.5x SIN evento Wyckoff + menciones
    # en Twitter acelerando (ahora vs hace 7 dias) -> aviso. NO validado. Requiere twitter_sentiment.
    rumor_radar:
      enabled: false
      min_mention_ratio: 2.0

    # specs/037-microestructura-funding/: foto de funding, open interest, ratio long/short y libro de
    # ordenes de Binance al salir cada alerta. Solo se REGISTRA (no filtra ni cambia el mensaje).
    microstructure:
      enabled: false

  # ─────────────────────────────────────────
  # Dynamic Pairs - Filtrado automático de mercados
  # ─────────────────────────────────────────
  # Si enabled=true y market_pairs=null, usa filtros dinámicos
  # Flujo: DataManager.get_top_pairs() → Lista filtrada
  dynamic_pairs:
    enabled: false              # Activar filtrado dinámico
    source: volume              # volume | manual (futuro: coingecko)
    top_n: 50                   # Cantidad de pares a analizar
    quote_currency: USDT        # Moneda de cotización
    min_volume_24h: 1000000     # Volumen mínimo (en USDT)
    exclude:                    # Pares a excluir
      - USDC/USDT
      - BUSD/USDT
      - TUSD/USDT
      - DAI/USDT

  # ─────────────────────────────────────────
  # Correlation - Análisis de Contexto de Mercado
  # ─────────────────────────────────────────
  # Clasifica señales según correlación con BTC y contexto global
  # Calidad: A+ (mejor) → A → B → C (evitar)
  correlation:
    enabled: false              # Activar análisis de correlación
    reference_pair: BTC/USDT    # Par de referencia (líder del mercado)
    
    # Umbrales para clasificación
    thresholds:
      btc_bullish: 2.0          # % cambio 24h para considerar bullish
      btc_bearish: -2.0         # % cambio 24h para considerar bearish
      outperform_ratio: 1.2     # Ratio ALT/BTC para considerar outperforming
    
    # Filtro de calidad (opcional)
    quality_filter:
      enabled: false            # Si true, solo notifica señales de alta calidad
      min_quality: A            # Calidad mínima para notificar (A+, A, B, C)

exchanges: null

notifiers:
  # ─────────────────────────────────────────
  # Telegram - Notificador Principal
  # ─────────────────────────────────────────
  telegram:
    required:
      token: null
      chat_id: null
    optional:
      parse_mode: html
      template: |
        {% if status == 'hot' %}🟢 <b>Aviso informativo RSI/MACD: posible rebote</b>{% else %}🔴 <b>Aviso informativo RSI/MACD: posible corrección</b>{% endif %}

        📊 <b>{{market}}</b> ({{analysis.config.candle_period}})
        {{hot_cold_label|default('Señal detectada')}}

        {% if btc_trend == 'bullish' %}BTC hoy: 🟢 sube {{ (btc_change_24h|default(0))|abs|round(1) }}% en 24 h{% elif btc_trend == 'bearish' %}BTC hoy: 🔴 baja {{ (btc_change_24h|default(0))|abs|round(1) }}% en 24 h{% else %}BTC hoy: ⚪ lateral{% endif %}

        ⚠️ <b>Ojo:</b> en nuestras pruebas, los avisos de RSI/MACD <b>no predijeron el precio</b>. No compres ni vendas solo por esto. La señal principal del bot es «OPORTUNIDAD DE COMPRA».

        🕐 {{creation_date}}
  
  # ─────────────────────────────────────────
  # Webhook - Para integraciones futuras
  # ─────────────────────────────────────────
  webhook:
    required:
      url: null
    optional:
      username: null
      password: null
  
  # ─────────────────────────────────────────
  # Stdout - Debug/Desarrollo
  # ─────────────────────────────────────────
  stdout:
    required:
      enable: null
    optional:
      template: "{{exchange}}-{{market}}-{{indicator}}-{{indicator_number}} is {{status}}!{{ '\n' -}}"


