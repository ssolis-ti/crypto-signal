# ===========================================
# CRYPTO-SIGNAL: Configuración Profesional 4H
# Compatible con Fases 1-4 + SmartNotifications
# Última Actualización: 2026-01-19
# ===========================================

settings:
  update_interval: 300          # Intervalo entre análisis (segundos)
  market_pairs: false           # false = usar dynamic_pairs
  enable_charts: true           # Generar gráficos
  timezone: America/Santiago

  # ═══════════════════════════════════════════
  # ALERTAS WYCKOFF EN VIVO (specs/023-wyckoff-live-alerts/)
  # ═══════════════════════════════════════════
  # Unico edge validado con holdout in-sample/out-of-sample de este proyecto
  # (specs/017 y 050): spring con volumen extremo (>=2.5x) en 4h, y solo se manda a
  # Telegram si los springs liquidos (>= 20 millones USD/24h) son >= 20% de ese universo.
  # El spring suelto y el upthrust se registran y no entran al chat. Independiente del score de SignalEnhancer
  # (ya invalidado dos veces -- specs/007, specs/011). Envia un mensaje con ambos
  # encuadres (rapida 1-2h / sostenida 14d) y los numeros reales de la validacion.
  wyckoff_alerts:
    enabled: true
    # specs/031-wyckoff-twitter-sentiment/: seccion OPCIONAL e informativa en el mensaje,
    # con contenido de Twitter/X clasificado por un LLM (capitulacion/euforia/mixto/nada).
    # NO forma parte del edge validado (specs/017/018) y nunca decide si se envia la alerta
    # -- ver specs/030 (hallazgo cualitativo de n=5, no probado estadisticamente).
    # Requiere GETXAPI_API_KEY y GEMINI_API_KEY en .env; si faltan, se degrada sola
    # (la alerta base se envia igual, sin esta seccion).
    twitter_sentiment:
      enabled: true
    # specs/033-rumor-radar/: cruce volumen + rumor. Si una vela de 4h cierra con volumen
    # >= 2.5x el promedio SIN evento Wyckoff, mide la velocidad de menciones en Twitter
    # (ahora vs hace 7 dias). NO es la alerta de Telegram: se registra en
    # app/agent_state/rumor_radar.jsonl. El chat solo recibe el spring (compra).
    # Requiere twitter_sentiment.enabled y GETXAPI_API_KEY.
    rumor_radar:
      enabled: true
      min_mention_ratio: 2.0

    # specs/037-microestructura-funding/: foto de funding, open interest, ratio long/short y libro de
    # ordenes de Binance al salir cada alerta. Solo se REGISTRA (no filtra ni cambia el mensaje).
    microstructure:
      enabled: true

  # ═══════════════════════════════════════════
  # CONFIGURACIÓN DE PARES DINÁMICOS
  # ═══════════════════════════════════════════
  dynamic_pairs:
    enabled: true
    source: volume              # Ordenar por: volume
    top_n: 50                  # Cantidad de pares
    quote_currency: USDT        # Moneda de cotización
    min_volume_24h: 3000000     # Volumen mínimo 24h en USDT
    exclude:                    # Excluir stablecoins y pares problemáticos
      - USDC/USDT
      - BUSD/USDT
      - TUSD/USDT
      - DAI/USDT
      - USDP/USDT
      - FDUSD/USDT
      - FRAX/USDT
      - USD1/USDT
      - RLUSD/USDT
      - USDE/USDT
      - PYUSD/USDT
      - USDD/USDT
      - BFUSD/USDT
      - XUSD/USDT
      - EUR/USDT              # Fiat/stable en euros
      - EURI/USDT
      - AEUR/USDT
      - PAXG/USDT             # Oro tokenizado
      - XAUT/USDT
      - 币安人生/USDT          # Par inválido con caracteres especiales
  
  # ═══════════════════════════════════════════
  # ANÁLISIS DE CORRELACIÓN (Fase 4)
  # ═══════════════════════════════════════════
  correlation:
    enabled: true
    reference_pair: BTC/USDT
    thresholds:
      btc_bullish: 1.5          # % cambio BTC para considerar alcista
      btc_bearish: -1.0         # % cambio BTC para considerar bajista
      outperform_ratio: 1.3     # Ratio ALT/BTC para outperform
    quality_filter:
      enabled: false
      min_quality: A
    # ─────────────────────────────────────────
    # SCORING AVANZADO (Nuevos parámetros)
    # ─────────────────────────────────────────
    scoring:
      # Pesos de factores (ajustables)
      btc_weight: 15            # Puntos ± por tendencia BTC
      structure_weight: 10      # Penalización si Precio < EMA 99
      rsi_weight: 5             # Bonus por RSI oversold/overbought
      rsi_weight_bearish: 3     # [B] RSI reducido cuando estructura bearish
      sentiment_weight: 5       # Puntos ± por sentiment
      # Umbrales de RSI
      rsi_extreme_low: 25       # RSI < 25 = Extreme oversold
      rsi_oversold: 40          # RSI < 40 = Oversold
      rsi_overbought: 60        # RSI > 60 = Overbought
      rsi_extreme_high: 75      # RSI > 75 = Extreme overbought
      # Debug
      verbose_scoring: true     # Log detallado de cálculo de score
    # ─────────────────────────────────────────
    # OUTPUT CONTROL (Ajustes quirúrgicos)
    # ─────────────────────────────────────────
    output:
      # [A] Gate global por contexto BTC
      market_scan_mode: true    # Si bearish + all C → solo summary
      # [C] Límite de señales C
      max_c_signals: 5          # Máximo señales C en summary
      sort_by_score: true       # Ordenar por score descendente

# ═══════════════════════════════════════════
# EXCHANGES
# ═══════════════════════════════════════════
exchanges:
  binance:
    required:
      enabled: true

# ═══════════════════════════════════════════
# NOTIFICADORES
# ═══════════════════════════════════════════
notifiers:
  telegram:
    required:
      token: "TU_TOKEN_AQUI"
      chat_id: "TU_CHAT_ID_AQUI"
    optional:
      parse_mode: html
      # ─────────────────────────────────────────
      # TEMPLATE DE MENSAJE
      # ─────────────────────────────────────────
      # Campos disponibles:
      #   status        : hot / cold
      #   market        : BTC/USDT
      #   base_currency : BTC
      #   quote_currency: USDT
      #   exchange      : binance
      #   indicator     : rsi
      #   indicator_number: 0
      #   indicator_label: RSI 4h
      #   values        : {'rsi': '25.50'}
      #   prices        : Open: X High: Y Low: Z Close: W
      #   lrsi          : 0.05
      #   creation_date : 2026-01-19 15:30:00
      #   hot_cold_label: 🟢 RSI pullback
      #   analysis.config.candle_period: 4h
      #   analysis.config.hot / cold: umbrales
      #   analysis.config.period_count: 14
      #   
      # Campos de Correlación (si enabled):
      #   quality        : A+ / A / B / C
      #   score          : 0-100
      #   confidence     : 0-100
      #   btc_trend      : bullish / bearish / neutral
      #   btc_change_24h : -2.5
      #   relative_strength: 1.2
      #   market_sentiment: risk_on / risk_off / neutral
      #   context_note   : Explicación contextual
      #
      # Campos Derivados (Fase 2):
      #   rsi_slope, macd_acceleration, vwap_distance, momentum_divergence
      # ─────────────────────────────────────────
      template: |
        {% if status == 'hot' %}🟢 <b>Aviso informativo RSI/MACD: posible rebote</b>{% else %}🔴 <b>Aviso informativo RSI/MACD: posible corrección</b>{% endif %}

        📊 <b>{{market}}</b> ({{analysis.config.candle_period}})
        {{hot_cold_label|default('Señal detectada')}}

        {% if btc_trend == 'bullish' %}BTC hoy: 🟢 sube {{ (btc_change_24h|default(0))|abs|round(1) }}% en 24 h{% elif btc_trend == 'bearish' %}BTC hoy: 🔴 baja {{ (btc_change_24h|default(0))|abs|round(1) }}% en 24 h{% else %}BTC hoy: ⚪ lateral{% endif %}

        ⚠️ <b>Ojo:</b> en nuestras pruebas, los avisos de RSI/MACD <b>no predijeron el precio</b>. No compres ni vendas solo por esto. La señal principal del bot es «OPORTUNIDAD DE COMPRA».

        🕐 {{creation_date}}
# ═══════════════════════════════════════════
# INDICADORES (4H)
# ═══════════════════════════════════════════
indicators:
  rsi:
    - enabled: true
      alert_enabled: false      # apagado: no predijo el precio (specs/007, 011); poner true para el radar informativo
      alert_frequency: once
      signal: [rsi]
      hot: 30
      cold: 70
      hot_label: "🟢 RSI bajo: la moneda está muy vendida (podría rebotar)"
      cold_label: "🔴 RSI alto: la moneda está muy comprada (podría corregir)"
      indicator_label: "RSI 4h"
      mute_cold: false
      candle_period: 4h
      period_count: 14

  macd_cross:
    - enabled: true
      alert_enabled: false      # apagado: cruza ~16 veces/dia entre 28 pares y no predijo el precio
      alert_frequency: once
      signal: [macd, signal]
      hot_label: "🟢 MACD cruzó al alza (impulso alcista)"
      cold_label: "🔴 MACD cruzó a la baja (impulso bajista)"
      indicator_label: "MACD Cross 4h"
      mute_cold: false
      candle_period: 4h

  # ─────────────────────────────────────────
  # DESHABILITADOS
  # ─────────────────────────────────────────
  stochrsi_cross:
    - enabled: false
  momentum:
    - enabled: false
  mfi:
    - enabled: false
  obv:
    - enabled: false
  stoch_rsi:
    - enabled: false
  macd:
    - enabled: false
  ichimoku:
    - enabled: false
  iiv:
    - enabled: false

# ═══════════════════════════════════════════
# INFORMANTES (para análisis, no alertas)
# ═══════════════════════════════════════════
informants:
  ema:
    - enabled: true
      signal: [ema]
      candle_period: 4h
      period_count: 99

  sma:
    - enabled: true
      signal: [sma]
      candle_period: 4h
      period_count: 200

  bollinger_bands:
    - enabled: true
      signal: [upperband, middleband, lowerband]
      candle_period: 4h
      period_count: 21

  ohlcv:
    - enabled: true
      signal: [open, high, low, close]
      candle_period: 4h
      period_count: 15

  lrsi:
    - enabled: true
      signal: [lrsi]
      candle_period: 4h

  vwap:
    - enabled: true
      signal: [vwap]
      candle_period: 4h
      period_count: 15

# ═══════════════════════════════════════════
# CROSSOVERS
# ═══════════════════════════════════════════
crossovers:
  std_crossover:
    - enabled: false
      alert_enabled: true
      alert_frequency: once
      key_indicator: ema
      key_indicator_index: 0
      key_indicator_type: informants
      key_signal: ema
      crossed_indicator: sma
      crossed_indicator_index: 0
      crossed_indicator_type: informants
      crossed_signal: sma
