# ===========================================
# CRYPTO-SIGNAL: Configuración Profesional 4H
# Compatible con Fases 1-4 + SmartNotifications
# Última Actualización: 2026-01-19
# ===========================================

settings:
  update_interval: 300          # Intervalo entre análisis (segundos)
  market_pairs: false           # false = usar dynamic_pairs
  enable_charts: true           # Generar gráficos
  timezone: America/Santiago
  
  # ═══════════════════════════════════════════
  # CONFIGURACIÓN DE PARES DINÁMICOS
  # ═══════════════════════════════════════════
  dynamic_pairs:
    enabled: true
    source: volume              # Ordenar por: volume
    top_n: 20                   # Cantidad de pares
    quote_currency: USDT        # Moneda de cotización
    min_volume_24h: 3000000     # Volumen mínimo 24h en USDT
    exclude:                    # Excluir stablecoins y pares problemáticos
      - USDC/USDT
      - BUSD/USDT
      - TUSD/USDT
      - DAI/USDT
      - USDP/USDT
      - FDUSD/USDT
      - FRAX/USDT
      - USD1/USDT
      - PAXG/USDT
      - 币安人生/USDT          # Par inválido con caracteres especiales
  
  # ═══════════════════════════════════════════
  # ANÁLISIS DE CORRELACIÓN (Fase 4)
  # ═══════════════════════════════════════════
  correlation:
    enabled: true
    reference_pair: BTC/USDT
    thresholds:
      btc_bullish: 1.5          # % cambio BTC para considerar alcista
      btc_bearish: -1.0         # % cambio BTC para considerar bajista
      outperform_ratio: 1.3     # Ratio ALT/BTC para outperform
    quality_filter:
      enabled: false
      min_quality: A
    # ─────────────────────────────────────────
    # SCORING AVANZADO (Nuevos parámetros)
    # ─────────────────────────────────────────
    scoring:
      # Pesos de factores (ajustables)
      btc_weight: 15            # Puntos ± por tendencia BTC
      structure_weight: 10      # Penalización si Precio < EMA 99
      rsi_weight: 5             # Bonus por RSI oversold/overbought
      rsi_weight_bearish: 3     # [B] RSI reducido cuando estructura bearish
      sentiment_weight: 5       # Puntos ± por sentiment
      # Umbrales de RSI
      rsi_extreme_low: 25       # RSI < 25 = Extreme oversold
      rsi_oversold: 40          # RSI < 40 = Oversold
      rsi_overbought: 60        # RSI > 60 = Overbought
      rsi_extreme_high: 75      # RSI > 75 = Extreme overbought
      # Debug
      verbose_scoring: true     # Log detallado de cálculo de score
    # ─────────────────────────────────────────
    # OUTPUT CONTROL (Ajustes quirúrgicos)
    # ─────────────────────────────────────────
    output:
      # [A] Gate global por contexto BTC
      market_scan_mode: true    # Si bearish + all C → solo summary
      # [C] Límite de señales C
      max_c_signals: 5          # Máximo señales C en summary
      sort_by_score: true       # Ordenar por score descendente

# ═══════════════════════════════════════════
# EXCHANGES
# ═══════════════════════════════════════════
exchanges:
  binance:
    required:
      enabled: true

# ═══════════════════════════════════════════
# NOTIFICADORES
# ═══════════════════════════════════════════
notifiers:
  telegram:
    required:
      token: "TU_TOKEN_AQUI"
      chat_id: "TU_CHAT_ID_AQUI"
    optional:
      parse_mode: html
      # ─────────────────────────────────────────
      # TEMPLATE DE MENSAJE
      # ─────────────────────────────────────────
      # Campos disponibles:
      #   status        : hot / cold
      #   market        : BTC/USDT
      #   base_currency : BTC
      #   quote_currency: USDT
      #   exchange      : binance
      #   indicator     : rsi
      #   indicator_number: 0
      #   indicator_label: RSI 4h
      #   values        : {'rsi': '25.50'}
      #   prices        : Open: X High: Y Low: Z Close: W
      #   lrsi          : 0.05
      #   creation_date : 2026-01-19 15:30:00
      #   hot_cold_label: 🟢 RSI pullback
      #   analysis.config.candle_period: 4h
      #   analysis.config.hot / cold: umbrales
      #   analysis.config.period_count: 14
      #   
      # Campos de Correlación (si enabled):
      #   quality        : A+ / A / B / C
      #   score          : 0-100
      #   confidence     : 0-100
      #   btc_trend      : bullish / bearish / neutral
      #   btc_change_24h : -2.5
      #   relative_strength: 1.2
      #   market_sentiment: risk_on / risk_off / neutral
      #   context_note   : Explicación contextual
      #
      # Campos Derivados (Fase 2):
      #   rsi_slope, macd_acceleration, vwap_distance, momentum_divergence
      # ─────────────────────────────────────────
      template: |
        {% if status == 'hot' %}🟢 <b>COMPRA</b>{% else %}🔴 <b>VENTA</b>{% endif %} {% if quality == 'A+' %}⭐⭐⭐{% elif quality == 'A' %}⭐⭐{% elif quality == 'B' %}⭐{% endif %}
        
        📊 <b>{{market}}</b> | {{analysis.config.candle_period}}
        🎯 {{hot_cold_label|default('Señal detectada')}}
        
        {% if btc_trend == 'bullish' %}🟢 BTC Alcista (+{{btc_change_24h|round(2)}}%){% elif btc_trend == 'bearish' %}🔴 BTC Bajista ({{btc_change_24h|round(2)}}%){% else %}⚪ BTC Neutral{% endif %}
        
        {% if quality == 'A+' %}⚡ <b>A+</b> Señal muy fuerte ({{score|int}}/100){% elif quality == 'A' %}✅ <b>A</b> Señal sólida ({{score|int}}/100){% elif quality == 'B' %}⚠️ <b>B</b> Confirmar ({{score|int}}/100){% else %}❌ <b>C</b> Precaución ({{score|int}}/100){% endif %}
        
        {% if context_note %}💡 {{context_note}}{% endif %}
        
        ━━━━━━━━━━━━━━━━━━━━
        <code>
        [INFO]
        📅 {{creation_date}}
        💹 {{exchange}} | {{market}}
        📈 {{indicator}} #{{indicator_number}}
        🎚️ {{values}}
        📊 {{prices}}
        
        [CONTEXT]
        🎯 Quality: {{quality}} | Score: {{score|round(1)}}
        📉 BTC: {{btc_trend}} ({{btc_change_24h|round(2)}}%)
        💪 ALT/BTC: {{relative_strength|round(3)}}
        🌡️ Sentiment: {{market_sentiment}}
        
        [THRESHOLDS]
        🔥 Hot: {{analysis.config.hot|default('N/A')}}
        ❄️ Cold: {{analysis.config.cold|default('N/A')}}
        📏 Period: {{analysis.config.period_count|default('N/A')}}
        </code>

# ═══════════════════════════════════════════
# INDICADORES (4H)
# ═══════════════════════════════════════════
indicators:
  rsi:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal: [rsi]
      hot: 30
      cold: 70
      hot_label: "🟢 RSI pullback zona sobreventa"
      cold_label: "� RSI agotamiento zona sobrecompra"
      indicator_label: "RSI 4h"
      mute_cold: false
      candle_period: 4h
      period_count: 14

  macd_cross:
    - enabled: true
      alert_enabled: true
      alert_frequency: once
      signal: [macd, signal]
      hot_label: "🟢 MACD cruce ALCISTA"
      cold_label: "🔴 MACD cruce BAJISTA"
      indicator_label: "MACD Cross 4h"
      mute_cold: false
      candle_period: 4h

  # ─────────────────────────────────────────
  # DESHABILITADOS
  # ─────────────────────────────────────────
  stochrsi_cross:
    - enabled: false
  momentum:
    - enabled: false
  mfi:
    - enabled: false
  obv:
    - enabled: false
  stoch_rsi:
    - enabled: false
  macd:
    - enabled: false
  ichimoku:
    - enabled: false
  iiv:
    - enabled: false

# ═══════════════════════════════════════════
# INFORMANTES (para análisis, no alertas)
# ═══════════════════════════════════════════
informants:
  ema:
    - enabled: true
      signal: [ema]
      candle_period: 4h
      period_count: 99

  sma:
    - enabled: true
      signal: [sma]
      candle_period: 4h
      period_count: 200

  bollinger_bands:
    - enabled: true
      signal: [upperband, middleband, lowerband]
      candle_period: 4h
      period_count: 21

  ohlcv:
    - enabled: true
      signal: [open, high, low, close]
      candle_period: 4h
      period_count: 15

  lrsi:
    - enabled: true
      signal: [lrsi]
      candle_period: 4h

  vwap:
    - enabled: true
      signal: [vwap]
      candle_period: 4h
      period_count: 15

# ═══════════════════════════════════════════
# CROSSOVERS
# ═══════════════════════════════════════════
crossovers:
  std_crossover:
    - enabled: false
      alert_enabled: true
      alert_frequency: once
      key_indicator: ema
      key_indicator_index: 0
      key_indicator_type: informants
      key_signal: ema
      crossed_indicator: sma
      crossed_indicator_index: 0
      crossed_indicator_type: informants
      crossed_signal: sma
